plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vitafast.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vitafast.app"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "0.4.0"
    }

    // Committed debug keystore: keeps the signature stable across CI runs so
    // newer test APKs install over older ones without uninstalling.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
