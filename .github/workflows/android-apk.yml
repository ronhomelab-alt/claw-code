name: Android APK

on:
  push:
    branches: [claude/android-sms-spam-filter-3y52i4]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Run filter engine tests
        run: gradle -p android :filtercore:test

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-spam-filter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also publish the APK to an orphan git branch so it can be fetched
      # over plain git (the dev container cannot reach the artifact CDN).
      - name: Publish APK to apk-dist branch
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -rfq . || true
          cp /tmp/app-debug.apk sms-spam-filter-debug.apk
          echo "Debug APK built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > BUILD_INFO.txt
          git add sms-spam-filter-debug.apk BUILD_INFO.txt
          git commit -m "APK build from ${GITHUB_SHA}"
          git push -f origin apk-dist
