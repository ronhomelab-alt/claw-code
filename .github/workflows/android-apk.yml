name: Android APK

on:
  push:
    branches: [main, claude/android-sms-spam-filter-3y52i4]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

# Least privilege: this workflow only needs to read the checkout.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available in step-level `if:`; surface it via job env.
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.14.3'

      - name: Run filter engine tests
        run: gradle -p android :filtercore:test

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sms-spam-filter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # --- Release signing -------------------------------------------------
      # The keystore lives ONLY in repository secrets, never in git. Generate it
      # locally (see android/README.md) and add these secrets:
      #   RELEASE_KEYSTORE_B64       base64 of the .jks file
      #   RELEASE_KEYSTORE_PASSWORD  RELEASE_KEY_ALIAS  RELEASE_KEY_PASSWORD
      # Without them the job stops after the debug build.
      - name: Decode release keystore from secrets
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease

      - name: Upload release APK artifact
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sms-spam-filter-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove keystore from runner
        if: always() && env.HAS_RELEASE_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks"
