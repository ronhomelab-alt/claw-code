name: Android APK

on:
  push:
    branches: [claude/android-sms-spam-filter-3y52i4]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Run filter engine tests
        run: gradle -p android :filtercore:test

      # Non-debuggable release build. When RELEASE_KEYSTORE_BASE64 secret is
      # present it is signed with that (never-public) key; otherwise it falls
      # back to the debug key so personal builds still install in place.
      - name: Decode release keystore (if configured)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          echo "RELEASE_KEYSTORE_FILE=/tmp/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle -p android :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-spam-filter-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Also publish the APK to an orphan git branch so it can be fetched
      # over plain git (the dev container cannot reach the artifact CDN).
      - name: Publish APK to apk-dist branch
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          SIGNER=$([ -n "${RELEASE_KEYSTORE_FILE:-}" ] && echo "release-signed" || echo "debug-signed")
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/app.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -rfq . || true
          cp /tmp/app.apk sms-spam-filter-debug.apk
          echo "v${VERSION} | release APK (${SIGNER}, non-debuggable) built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > BUILD_INFO.txt
          git add sms-spam-filter-debug.apk BUILD_INFO.txt
          git commit -m "APK build from ${GITHUB_SHA}"
          git push -f origin apk-dist
