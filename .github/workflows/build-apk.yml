name: Build VitaFast APK

on:
  push:
    branches: [claude/fasting-app-prototype-jsl4k3]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vitafast-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vitafast-apk
          path: vitafast-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vitafast-apk \
            --title "VitaFast (debug APK)" \
            --notes "Sideload build of the VitaFast fasting app. Download vitafast-debug.apk on your phone and open it to install." \
            --target "${GITHUB_SHA}" || true
          gh release upload vitafast-apk vitafast-debug.apk --clobber
